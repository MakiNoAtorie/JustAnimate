name: Build & Tests
permissions:
  contents: read
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guards:
    name: Source guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the colour guard diffs against the PR base
      - name: No UTF-8 BOM and no ponytail markers in C++ sources
        run: |
          if git ls-files -z '*.cpp' '*.h' | LC_ALL=C xargs -0 grep -l $'\xEF\xBB\xBF'; then exit 1; fi
          if git grep -n 'ponytail:' -- '*.cpp' '*.h'; then exit 1; fi
      - name: Every test file has a TEST_CASE; no private Qt headers outside external/
        run: |
          if git grep -L TEST_CASE -- 'tests/src/test_*.cpp' | grep .; then exit 1; fi
          if git grep -nE '#include\s*[<"](qpa/|private/|[^>"]*_p\.h)' -- '*.cpp' '*.h' ':!core_lib/src/external'; then exit 1; fi
      - name: No new hard-coded UI colours
        if: github.event_name == 'pull_request'
        run: |
          bash tools/check-new-colours.sh ${{ github.event.pull_request.base.sha }}

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
            qt-arch: clang_64
          - name: Windows
            os: windows-2022
            qt-arch: win64_msvc2019_64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev qt6-tools-dev \
            qt6-tools-dev-tools qt6-l10n-tools libgl-dev ninja-build \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good  # QMediaPlayer crashes without them

      - name: Install Qt (macOS, Windows)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: ${{ matrix.qt-arch }}
          modules: qtmultimedia

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DJUSTANIMATE_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ./build/pencil2d_tests --order rand --rng-seed ${{ github.run_number }}

      # Packages: a Release build with Qt and ffmpeg bundled, uploaded as a workflow artifact
      - name: Download ffmpeg (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/pencil2d/pencil2d-deps/releases/download/ffmpge-v4.1.1/ffmpeg-win64.zip -OutFile ffmpeg-win64.zip
          $expected = '70FF7D439FF98EAF7055559E5E9D22E36892D3EB24D07E31C64307B875382178'
          $actual = (Get-FileHash -Algorithm SHA256 ffmpeg-win64.zip).Hash
          if ($actual -ne $expected) { throw "ffmpeg-win64.zip SHA-256 mismatch: expected $expected, got $actual" }
          Expand-Archive ffmpeg-win64.zip -DestinationPath ffmpeg
          "FFMPEG=$("$PWD\ffmpeg\ffmpeg.exe".Replace('\', '/'))" >> $env:GITHUB_ENV

      - name: Download ffmpeg (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          curl --retry 5 --retry-delay 15 --max-time 120 -fsSLo ffmpeg.7z https://evermeet.cx/ffmpeg/ffmpeg-8.0.1.7z
          curl --retry 5 --retry-delay 15 --max-time 120 -fsSLo ffmpeg.7z.sig https://evermeet.cx/ffmpeg/ffmpeg-8.0.1.7z.sig
          curl --retry 5 --retry-delay 15 --max-time 120 -fsSL https://evermeet.cx/ffmpeg/0x1A660874.asc | gpg --import
          gpg --verify ffmpeg.7z.sig ffmpeg.7z
          mkdir ffmpeg && bsdtar -xf ffmpeg.7z -C ffmpeg
          echo "FFMPEG=$PWD/ffmpeg/ffmpeg" >> "$GITHUB_ENV"

      - name: Configure release
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUSTANIMATE_WERROR=ON -DJUSTANIMATE_FFMPEG="${{ env.FFMPEG }}"

      - name: Build release
        run: cmake --build build-release --target pencil2d

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: /usr/lib/qt6/bin/qmake
          LDAI_OUTPUT: JustAnimate-x86_64.AppImage
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so  # headless use (CLI export, the smoke test below)
        run: |
          mkdir -p packages tools
          for t in linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
                   linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage; do
            curl --retry 5 --retry-delay 15 --max-time 120 -fsSL "https://github.com/$t" -o "tools/$(basename "$t")"
          done
          chmod +x tools/*.AppImage
          DESTDIR="$PWD/AppDir" cmake --install build-release --prefix /usr
          PATH="$PWD/tools:$PATH" linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv "$LDAI_OUTPUT" packages/

      - name: Package (macOS DMG, Windows installer)
        if: runner.os != 'Linux'
        working-directory: build-release
        shell: bash
        # Call CMake's cpack by path: on Windows runners "cpack" can be Chocolatey's
        run: '"$(dirname "$(command -v cmake)")/cpack" -B ../packages'

      - name: Smoke test the package (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ./packages/JustAnimate-x86_64.AppImage --version
          ./packages/JustAnimate-x86_64.AppImage tests/data/camera-path-test.pclx -o smoke.png
          test -s smoke0001.png  # one PNG per frame

      - name: Smoke test the package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir smoke-win && unzip -q packages/*.zip -d smoke-win
          ./smoke-win/*/justanimate.exe --version
          ./smoke-win/*/justanimate.exe tests/data/camera-path-test.pclx -o smoke.png
          test -s smoke0001.png

      - name: Smoke test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Start-Process -Wait: the installer and the app are GUI programs, a plain call does not wait for them
          function Run($exe, $argList) {
            $p = Start-Process -FilePath $exe -ArgumentList $argList -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "$exe $argList exited with code $($p.ExitCode)" }
          }
          $installer = (Get-ChildItem packages\*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'JustAnimate-installed'
          Run $installer @('/S', "/D=$dir")  # /D must be last and unquoted
          Run "$dir\justanimate.exe" @('--version')
          Run "$dir\justanimate.exe" @('tests/data/camera-path-test.pclx', '-o', 'smoke-installed.png')
          if (-not (Test-Path smoke-installed0001.png) -or (Get-Item smoke-installed0001.png).Length -eq 0) { throw 'the installed app exported nothing' }

      - name: Smoke test the package (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: ''  # the bundle ships the cocoa platform plugin only
        run: |
          mkdir smoke-mac
          hdiutil attach packages/*.dmg -nobrowse -readonly -mountpoint "$PWD/smoke-mac"
          app="$PWD/smoke-mac/JustAnimate.app/Contents/MacOS/JustAnimate"
          # Diagnostics for a bundle that does not start; they never fail the step
          otool -L "$app" || true
          otool -l "$app" | grep -A2 LC_RPATH || true
          ls "$PWD/smoke-mac/JustAnimate.app/Contents/Frameworks" || true
          codesign --verify --deep --verbose=2 "$PWD/smoke-mac/JustAnimate.app" || true
          "$app" --version
          "$app" tests/data/camera-path-test.pclx -o smoke-dmg.png
          test -s smoke-dmg0001.png
          # The exited app can still hold the volume for a moment; cleanup never fails the step
          hdiutil detach "$PWD/smoke-mac" || hdiutil detach -force "$PWD/smoke-mac" || true

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: JustAnimate-${{ matrix.name }}
          path: |
            packages/*.AppImage
            packages/*.exe
            packages/*.zip
            packages/*.dmg
          retention-days: 14
          if-no-files-found: error

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      # The emergency-save crash test (child process) installs its own SIGSEGV
      # handler; ASan must let it run, not replace it.
      ASAN_OPTIONS: allow_user_segv_handler=1:detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
      # QMediaPlayer's GStreamer device monitor leaks inside libpulse.
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan.supp
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Qt
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev qt6-tools-dev \
            qt6-tools-dev-tools qt6-l10n-tools libgl-dev ninja-build \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good  # QMediaPlayer crashes without them

      - name: Configure
        run: cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DJUSTANIMATE_WERROR=ON -DJUSTANIMATE_SANITIZE=ON

      - name: Build
        run: cmake --build build-san --target pencil2d_tests

      - name: Run tests
        run: ./build-san/pencil2d_tests --order rand --rng-seed ${{ github.run_number }}
